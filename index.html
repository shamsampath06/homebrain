<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/homebrain-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="manifest" href="/manifest.json" />
    <title>HomeBrain - Autonomous Multimodal Cognitive Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>
    <script>
      // Clean up legacy service workers silently in background without blocking rendering
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
    </script>
  </head>
  <body class="bg-[#FAF8F3] dark:bg-[#080B12] text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen selection:bg-brand-500 selection:text-white transition-colors duration-200">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF8F3;">
        <div style="text-align:center;padding:24px;">
          <div style="width:36px;height:36px;border:3px solid #E2E8F0;border-top-color:#0284c7;border-radius:50%;animation:hb-spin 0.6s linear infinite;margin:0 auto 12px;"></div>
          <div style="font-weight:700;color:#0F172A;font-size:15px;letter-spacing:-0.2px;">HomeBrain OS</div>
          <div style="font-size:12px;color:#64748B;margin-top:3px;">Opening workspace...</div>
        </div>
      </div>
      <style>@keyframes hb-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
